<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Negocie Fácil — Missão Sergipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2447;--navy2:#13346b;--gold:#e8b520;--gold2:#fff4cc;--bg:#f3f5f9;--card:#fff;--line:#dde3ee;--txt:#1b2540;--mut:#6b7691;--ok:#1f8a4c;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;font-size:15px}
header{background:var(--navy);color:#fff;padding:16px 20px 0;border-bottom:4px solid var(--gold)}
header h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-size:30px;letter-spacing:.5px;font-weight:700}
header h1 span{color:var(--gold)}
header p{margin:2px 0 10px;color:#b9c4dd;font-size:13px}
.tabs{display:flex;gap:4px;max-width:1100px;margin:0 auto}
.tabs button{border:0;background:transparent;color:#b9c4dd;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;border-radius:8px 8px 0 0}
.tabs button.on{background:var(--bg);color:var(--navy)}
.wrap{max-width:1100px;margin:0 auto}
header .wrap{padding:0}
main{max-width:1100px;margin:18px auto;padding:0 14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.page{display:none}.page.on{display:block}
#pgProposta.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{margin:0 0 12px;font-family:'Barlow Condensed',sans-serif;font-size:20px;color:var(--navy);text-transform:uppercase;letter-spacing:.6px;border-bottom:2px solid var(--gold);padding-bottom:6px}
.card h2.mt{margin-top:22px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin:10px 0 4px}
select,input[type=text],input[type=number],input[type=date],textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--txt)}
select:disabled,input:disabled{background:#eef1f7;color:var(--mut)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--txt)}
.chk input{width:18px;height:18px}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:10px 4px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;color:var(--navy)}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.warn{background:#fdecea;color:var(--bad);border:1px solid #f3c1bd;border-radius:8px;padding:10px;font-size:13px;margin-top:10px}
.aluno{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;background:#fafbfd}
.aluno .top{display:flex;justify-content:space-between;align-items:center}
.aluno .top b{font-family:'Barlow Condensed',sans-serif;font-size:17px;color:var(--navy)}
.mini{border:0;background:transparent;color:var(--bad);font:inherit;font-weight:700;cursor:pointer;font-size:13px}
.btn2{margin-top:10px;width:100%;padding:10px;border:1px dashed var(--navy);background:#fff;color:var(--navy);border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.line b{text-align:right}
.line.sub{color:var(--mut);font-size:13px}
.line.tot{border-bottom:0;background:var(--gold2);margin-top:8px;padding:12px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:22px;color:var(--navy)}
.blk{margin-top:14px;font-family:'Barlow Condensed',sans-serif;font-size:17px;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--line)}
.neg{color:var(--ok)}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.actions button,.cfgbtn{padding:12px 6px;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}
.actions button.g{background:var(--gold);color:var(--navy)}
.actions button:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:500px){.actions{grid-template-columns:1fr}}
#pgConfig{max-width:1100px;margin:18px auto;padding:0 14px}
#pgConfig .card{margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
table.cfg{width:100%;border-collapse:collapse;margin-top:8px}
table.cfg th{text-align:left;font-size:12px;color:var(--mut);text-transform:uppercase;padding:4px}
table.cfg td{padding:3px 4px}
.cfgbar{display:flex;flex-wrap:wrap;gap:8px}
.cfgbar .cfgbtn.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding:0 14px">
    <h1>Negocie <span>Fácil</span> — Missão Sergipe</h1>
    <p>Simulador de negociação de matrículas · Ano letivo <span id="hdrAno"></span></p>
    <div class="tabs">
      <button class="on" data-pg="pgProposta">Proposta</button>
      <button data-pg="pgConfig">Configurações</button>
    </div>
  </div>
</header>

<div class="page on" id="pgProposta">
<main>
  <section class="card">
    <h2>Dados da negociação</h2>

    <label for="selEscola">Escola</label>
    <select id="selEscola"></select>

    <label for="selPromotor">Promotor</label>
    <select id="selPromotor"></select>

    <label for="inpResp">Responsável</label>
    <input type="text" id="inpResp" placeholder="Nome do responsável">

    <h2 class="mt">Alunos</h2>
    <div id="alunosBox"></div>
    <button type="button" class="btn2" id="btnAddAluno">+ Adicionar aluno (irmão)</button>

    <h2 class="mt">Pagamento da anuidade</h2>
    <div class="seg" id="segForma"></div>
    <label for="selCond">Condição</label>
    <select id="selCond"></select>
    <div class="hint" id="hintForma"></div>

    <h2 class="mt">Desconto na mensalidade</h2>
    <label for="selParceria">Parceria (desconto fixo, vale para todos os alunos)</label>
    <select id="selParceria"></select>
    <div class="hint" id="hintDesc"></div>

    <h2 class="mt">Fundo Social Aluno (FSA)</h2>
    <label class="chk"><input type="checkbox" id="chkFsa"> Responsável optou por pagar o FSA</label>
    <label for="selFsaParc">Pagamento do FSA</label>
    <select id="selFsaParc"></select>
    <div class="hint" id="hintFsa"></div>

    <label for="inpValidade">Validade da proposta</label>
    <input type="date" id="inpValidade">
  </section>

  <section class="card">
    <h2>Proposta</h2>
    <div id="out"></div>
    <div class="actions">
      <button class="g" id="btnZap" onclick="copiarResumo()">Copiar WhatsApp</button>
      <button id="btnPdf" onclick="imprimirPDF()">Imprimir / PDF</button>
    </div>
  </section>
</main>
</div>

<div class="page" id="pgConfig"></div>
<div id="toast"></div>

<script>
/* ============ PADRÕES (fonte: planilha de levantamento Missão Sergipe) ============ */
const DEFAULTS = {
  cfg: {
    ano: 2027,
    parcelasAno: 12,        // nº de mensalidades da anuidade
    descNovoMax: 10,        // % máximo do promotor (aluno novo)
    fsaMaxParcelas: 4,
    fsaDescIrmaoPct: 50,    // % de desconto no FSA a partir do 2º filho
    cartaoParcSemestre: 6,  // parcelas no cartão por semestre
    cartaoParcAnual: 12     // parcelas no cartão na anuidade
  },
  parcerias: [
    {id:'pm',   nome:'Policial Militar',            pct:20},
    {id:'pas',  nome:'Pastor de Igreja Evangélica', pct:15},
    {id:'cond', nome:'Condomínio parceiro',         pct:15},
    {id:'oab',  nome:'OAB Estadual',                pct:15},
    {id:'adv',  nome:'Membro de Igreja Adventista', pct:15}
  ],
  escolas: {
    aracaju: {
      nome:'Colégio Adventista de Aracaju', cidade:'Aracaju', fsa:450,
      promotores:['João Mendonça'],
      series:[
        {id:'mat25', nome:'Maternal - 2 anos e meio', mens:1119, did:719.28},
        {id:'mat3',  nome:'Maternal - 3 anos',        mens:1119, did:1387.38},
        {id:'pre1',  nome:'Pré I',                    mens:1119, did:1868.48},
        {id:'pre2',  nome:'Pré II',                   mens:1119, did:1868.48},
        {id:'a1', nome:'1º Ano', mens:1350, did:2523},
        {id:'a2', nome:'2º Ano', mens:1350, did:2523},
        {id:'a3', nome:'3º Ano', mens:1350, did:2509},
        {id:'a4', nome:'4º Ano', mens:1350, did:2517},
        {id:'a5', nome:'5º Ano', mens:1350, did:2504},
        {id:'a6', nome:'6º Ano', mens:1595, did:2693},
        {id:'a7', nome:'7º Ano', mens:1595, did:2665},
        {id:'a8', nome:'8º Ano', mens:1595, did:2430},
        {id:'a9', nome:'9º Ano', mens:1595, did:2458},
        {id:'em1', nome:'1º Ano Ensino Médio', mens:1899, did:1829},
        {id:'em2', nome:'2º Ano Ensino Médio', mens:1899, did:1903}
      ]
    },
    lagarto: {
      nome:'Escola Adventista de Lagarto', cidade:'Lagarto', fsa:250,
      promotores:['Jonatas Timoteo'],
      series:[
        {id:'mat3',  nome:'Maternal - 3 anos', mens:695, did:1387.38},
        {id:'pre1',  nome:'Pré I',  mens:695, did:1868.48},
        {id:'pre2',  nome:'Pré II', mens:695, did:1868.48},
        {id:'a1', nome:'1º Ano', mens:749, did:2268},
        {id:'a2', nome:'2º Ano', mens:749, did:2268},
        {id:'a3', nome:'3º Ano', mens:749, did:2254},
        {id:'a4', nome:'4º Ano', mens:749, did:2262},
        {id:'a5', nome:'5º Ano', mens:749, did:2249},
        {id:'a6', nome:'6º Ano', mens:827, did:2438},
        {id:'a7', nome:'7º Ano', mens:827, did:2410},
        {id:'a8', nome:'8º Ano', mens:827, did:2175},
        {id:'a9', nome:'9º Ano', mens:827, did:2203}
      ]
    }
  }
};

const LS_KEY = 'negocie_facil_sergipe_cfg_v1';
const clone = o => JSON.parse(JSON.stringify(o));
let CFG, PARCERIAS, DB;

function aplicarConfig(c){
  CFG = Object.assign(clone(DEFAULTS.cfg), c.cfg || {});
  PARCERIAS = (c.parcerias && c.parcerias.length) ? c.parcerias : clone(DEFAULTS.parcerias);
  DB = {escolas: (c.escolas && Object.keys(c.escolas).length) ? c.escolas : clone(DEFAULTS.escolas)};
}
function carregarConfig(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
  aplicarConfig(saved || clone(DEFAULTS));
}
function salvarConfig(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({cfg:CFG, parcerias:PARCERIAS, escolas:DB.escolas})); }catch(e){}
}

/* ============ UTIL ============ */
const $ = id => document.getElementById(id);
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const brl = n => 'R$ ' + n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pctTxt = n => String(n).replace('.',',') + '%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function fmtData(v){if(!v)return '';const [y,m,d]=v.split('-');return d+'/'+m+'/'+y;}
const ORD = i => (i+1) + 'º';

let formaSel = 'mensal';
let alunos = [{nome:'', serie:'', desc:0}];
window._dc = null;

const FORMAS = [
  {id:'mensal',    nome:'Mensal (boleto)'},
  {id:'semestral', nome:'Semestral'},
  {id:'anual',     nome:'Anual'}
];

function condicoes(f){
  const n = CFG.parcelasAno;
  if(f === 'mensal')    return [{id:'boleto', nome:n + ' boletos mensais'}];
  if(f === 'semestral') return [
    {id:'vista',  nome:'À vista em cada semestre (2 pagamentos)'},
    {id:'cartao', nome:'Cartão: ' + CFG.cartaoParcSemestre + 'x no 1º semestre + ' + CFG.cartaoParcSemestre + 'x no 2º'}
  ];
  return [
    {id:'vista',  nome:'À vista (1 pagamento)'},
    {id:'cartao', nome:'Cartão em ' + CFG.cartaoParcAnual + 'x'}
  ];
}

/* ============ UI — PROPOSTA ============ */
function fill(sel, items, ph){
  sel.innerHTML = (ph ? '<option value="">'+ph+'</option>' : '') +
    items.map(i => '<option value="'+esc(i.v)+'">'+esc(i.t)+'</option>').join('');
}
const escolaAtual = () => DB.escolas[$('selEscola').value];

function preencherSelects(){
  const vEsc = $('selEscola').value, vPar = $('selParceria').value, vFsa = $('selFsaParc').value;
  fill($('selEscola'), Object.entries(DB.escolas).map(([k,e]) => ({v:k,t:e.nome})), 'Selecione a escola…');
  if(DB.escolas[vEsc]) $('selEscola').value = vEsc;
  fill($('selParceria'), PARCERIAS.map(p => ({v:p.id,t:p.nome+' — '+pctTxt(p.pct)})), 'Sem parceria');
  if(PARCERIAS.some(p => p.id === vPar)) $('selParceria').value = vPar;
  const parcs = [{v:'1',t:'À vista (1x)'}];
  for(let i=2;i<=CFG.fsaMaxParcelas;i++) parcs.push({v:String(i),t:'Parcelado em '+i+'x'});
  fill($('selFsaParc'), parcs);
  if(parcs.some(p => p.v === vFsa)) $('selFsaParc').value = vFsa;
  $('hdrAno').textContent = CFG.ano;
  preencherPromotor();
  renderAlunos();
}

function preencherPromotor(){
  const e = escolaAtual(), cur = $('selPromotor').value;
  $('selPromotor').disabled = !e;
  if(e){
    fill($('selPromotor'), e.promotores.map(p => ({v:p,t:p})), 'Selecione o promotor…');
    if(e.promotores.includes(cur)) $('selPromotor').value = cur;
    else if(e.promotores.length === 1) $('selPromotor').value = e.promotores[0];
  } else fill($('selPromotor'), [], 'Selecione a escola primeiro');
}

function renderAlunos(){
  const e = escolaAtual();
  const parcOn = !!$('selParceria').value;
  $('alunosBox').innerHTML = alunos.map((a,i) => {
    const opts = e ? '<option value="">Selecione a série…</option>' +
      e.series.map(s => '<option value="'+esc(s.id)+'"'+(s.id===a.serie?' selected':'')+'>'+esc(s.nome)+'</option>').join('')
      : '<option value="">Selecione a escola primeiro</option>';
    return '<div class="aluno"><div class="top"><b>Aluno '+(i+1)+(i>0?' · FSA com '+pctTxt(CFG.fsaDescIrmaoPct)+' de desconto':'')+'</b>'+
      (alunos.length>1?'<button type="button" class="mini" data-act="rm" data-i="'+i+'">remover</button>':'')+'</div>'+
      '<label>Nome do aluno</label><input type="text" data-i="'+i+'" data-k="nome" value="'+esc(a.nome)+'" placeholder="Nome do aluno">'+
      '<div class="row"><div><label>Série</label><select data-i="'+i+'" data-k="serie"'+(e?'':' disabled')+'>'+opts+'</select></div>'+
      '<div><label>Desc. aluno novo (%)</label><input type="number" min="0" max="'+CFG.descNovoMax+'" step="0.5" data-i="'+i+'" data-k="desc" value="'+(parcOn ? '' : a.desc)+'"'+(parcOn?' disabled placeholder="parceria"':'')+'></div></div></div>';
  }).join('');
}

function init(){
  carregarConfig();
  $('segForma').innerHTML = FORMAS.map(f => '<button type="button" data-f="'+f.id+'">'+f.nome+'</button>').join('');
  $('segForma').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    formaSel = b.dataset.f; atualizar();
  });
  $('selEscola').addEventListener('change', () => {
    alunos.forEach(a => a.serie = '');
    preencherPromotor(); renderAlunos(); atualizar();
  });
  $('selParceria').addEventListener('change', () => { renderAlunos(); atualizar(); });
  ['selPromotor','selCond','chkFsa','selFsaParc','inpResp','inpValidade']
    .forEach(id => { $(id).addEventListener('input', atualizar); $(id).addEventListener('change', atualizar); });

  const box = $('alunosBox');
  const onAluno = e => {
    const t = e.target, i = +t.dataset.i, k = t.dataset.k;
    if(isNaN(i) || !k) return;
    if(k === 'desc'){
      let v = parseFloat(t.value);
      alunos[i].desc = isNaN(v) ? 0 : Math.min(CFG.descNovoMax, Math.max(0, v));
    } else alunos[i][k] = t.value;
    atualizar();
  };
  box.addEventListener('input', onAluno);
  box.addEventListener('change', e => {
    onAluno(e);
    if(e.target.dataset.k === 'desc'){ e.target.value = alunos[+e.target.dataset.i].desc; }
  });
  box.addEventListener('click', e => {
    const b = e.target.closest('[data-act="rm"]'); if(!b) return;
    alunos.splice(+b.dataset.i, 1); renderAlunos(); atualizar();
  });
  $('btnAddAluno').addEventListener('click', () => { alunos.push({nome:'', serie:'', desc:0}); renderAlunos(); atualizar(); });

  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === b.dataset.pg));
    if(b.dataset.pg === 'pgConfig') renderConfig();
  }));

  preencherSelects();
  atualizar();
}

/* ============ CÁLCULO ============ */
function calcular(){
  const e = escolaAtual();
  if(!e || !alunos.some(a => a.serie)) return null;

  const forma = FORMAS.find(f => f.id === formaSel);
  const cond = $('selCond').value;
  const parc = PARCERIAS.find(p => p.id === $('selParceria').value) || null;
  const d = {
    escola:e.nome, cidade:e.cidade, promotor:$('selPromotor').value, resp:$('inpResp').value.trim(),
    validade:fmtData($('inpValidade').value), ano:CFG.ano, forma, cond, parceria:parc, completo:true, alunos:[]
  };

  alunos.forEach((a,i) => {
    const s = e.series.find(x => x.id === a.serie);
    if(!s){ d.completo = false; d.motivo = 'Selecione a série do aluno ' + (i+1) + '.'; return; }
    if(s.mens == null || s.did == null){ d.completo = false; d.motivo = s.nome + ' — valores de mensalidade/didáticos não cadastrados. Preencha em Configurações.'; return; }
    const descPct = parc ? parc.pct : Math.min(CFG.descNovoMax, Math.max(0, a.desc || 0));   // não acumula: parceria trava
    const descValor = r2(s.mens * descPct / 100);
    const mensLiq = r2(s.mens - descValor);
    const fsaValor = i === 0 ? e.fsa : r2(e.fsa * (1 - CFG.fsaDescIrmaoPct / 100));
    d.alunos.push({
      ord:i, nome:a.nome.trim(), serie:s.nome, mensCheia:s.mens, descPct, descValor, mensLiq,
      anuidadeCheia:r2(s.mens * CFG.parcelasAno), anuidade:r2(mensLiq * CFG.parcelasAno),
      did:s.did, fsaValor, fsaTabela:e.fsa
    });
  });
  if(!d.completo) return d;

  const n = CFG.parcelasAno;
  const sum = k => r2(d.alunos.reduce((t,a) => t + a[k], 0));
  d.mensLiqTotal = sum('mensLiq');
  d.anuidadeTotal = sum('anuidade');
  d.economiaTotal = r2(sum('anuidadeCheia') - d.anuidadeTotal);
  d.didTotal = sum('did');

  d.fsaOpt = $('chkFsa').checked;
  d.fsaTotal = sum('fsaValor');
  d.fsaParc = Math.min(CFG.fsaMaxParcelas, Math.max(1, parseInt($('selFsaParc').value) || 1));
  d.fsaParcValor = r2(d.fsaTotal / d.fsaParc);

  d.total = r2(d.anuidadeTotal + d.didTotal + (d.fsaOpt ? d.fsaTotal : 0));
  d.alunos.forEach(a => a.total = r2(a.anuidade + a.did + (d.fsaOpt ? a.fsaValor : 0)));

  // plano de pagamento da anuidade
  if(forma.id === 'mensal'){
    d.plano = {titulo:'Mensal (boleto)', texto:n + ' boletos de ' + brl(d.mensLiqTotal)};
  } else if(forma.id === 'semestral'){
    const v = r2(d.mensLiqTotal * n / 2);
    if(cond === 'cartao'){
      const p = CFG.cartaoParcSemestre;
      d.plano = {titulo:'Semestral no cartão', texto:'2 semestres de ' + brl(v) + ', cada um em ' + p + 'x de ' + brl(r2(v/p)) + ' no cartão'};
    } else d.plano = {titulo:'Semestral à vista', texto:'2 pagamentos semestrais de ' + brl(v) + ' à vista'};
  } else {
    const v = d.anuidadeTotal;
    if(cond === 'cartao'){
      const p = CFG.cartaoParcAnual;
      d.plano = {titulo:'Anual no cartão', texto:brl(v) + ' em ' + p + 'x de ' + brl(r2(v/p)) + ' no cartão'};
    } else d.plano = {titulo:'Anual à vista', texto:brl(v) + ' à vista'};
  }
  return d;
}

function atualizar(){
  document.querySelectorAll('#segForma button').forEach(b => b.classList.toggle('on', b.dataset.f === formaSel));
  const cs = condicoes(formaSel), curC = $('selCond').value;
  fill($('selCond'), cs.map(c => ({v:c.id,t:c.nome})));
  $('selCond').value = cs.some(c => c.id === curC) ? curC : cs[0].id;
  $('selCond').disabled = cs.length < 2;
  $('hintForma').textContent = formaSel === 'mensal' ? 'Mensalidades em boleto, sem desconto por forma de pagamento.' :
    'Sem desconto adicional. Cartão parcelado: valores sem juros (conforme política da escola).';

  $('hintDesc').textContent = $('selParceria').value
    ? 'Desconto de parceria travado. Não acumula com desconto de aluno novo.'
    : 'Promotor define de 0% a ' + CFG.descNovoMax + '% por aluno. Descontos não acumulam: vale o maior.';

  const fsaOn = $('chkFsa').checked;
  $('selFsaParc').disabled = !fsaOn;
  const e = escolaAtual();
  $('hintFsa').textContent = 'Opcional. ' + (e ? brl(e.fsa) + ' por aluno; 2º filho em diante com ' + pctTxt(CFG.fsaDescIrmaoPct) + ' de desconto. ' : '') +
    'À vista ou em até ' + CFG.fsaMaxParcelas + 'x, sem data fixa.';

  const d = calcular();
  window._dc = d;
  const ok = !!(d && d.completo);
  ['btnZap','btnPdf'].forEach(id => $(id).disabled = !ok);

  const out = $('out');
  if(!d){ out.innerHTML = '<div class="empty">Selecione escola e série para montar a proposta.</div>'; return; }
  if(!d.completo){ out.innerHTML = '<div class="warn">' + esc(d.motivo) + '</div>'; return; }

  const L = (a,b,cls) => '<div class="line '+(cls||'')+'"><span>'+a+'</span><b>'+b+'</b></div>';
  let h = L('Escola', esc(d.escola));
  d.alunos.forEach(a => {
    h += '<div class="blk">Aluno ' + (a.ord+1) + (a.nome ? ' — ' + esc(a.nome) : '') + '</div>';
    h += L('Série', esc(a.serie));
    h += L('Mensalidade cheia', brl(a.mensCheia));
    if(a.descPct > 0) h += L('Desconto' + (d.parceria ? ' — ' + esc(d.parceria.nome) : ' aluno novo') + ' (' + pctTxt(a.descPct) + ')', '<span class="neg">− ' + brl(a.descValor) + '</span>');
    h += L('Mensalidade com desconto', brl(a.mensLiq));
    h += L('Anuidade (' + CFG.parcelasAno + ' mensalidades)', brl(a.anuidade));
    h += L('Material escolar (didáticos)', brl(a.did));
  });

  h += '<div class="blk">Fundo Social Aluno' + (d.fsaOpt ? '' : ' (opcional — fora do total)') + '</div>';
  d.alunos.forEach(a => {
    h += L('Aluno ' + (a.ord+1) + (a.nome ? ' — ' + esc(a.nome) : '') + (a.ord > 0 ? ' (−' + pctTxt(CFG.fsaDescIrmaoPct) + ')' : ''), brl(a.fsaValor));
  });
  h += L('<b>Total FSA</b>', brl(d.fsaTotal));
  if(d.fsaOpt) h += L('Pagamento do FSA', d.fsaParc === 1 ? 'à vista' : d.fsaParc + 'x de ' + brl(d.fsaParcValor), 'sub');

  h += '<div class="blk">Resumo</div>';
  h += L('Anuidade total', brl(d.anuidadeTotal));
  if(d.economiaTotal > 0) h += L('Economia no ano', '<span class="neg">' + brl(d.economiaTotal) + '</span>', 'sub');
  h += L('Didáticos total', brl(d.didTotal));
  h += L('FSA total', d.fsaOpt ? brl(d.fsaTotal) : 'não optou');
  h += L('Anuidade — ' + esc(d.plano.titulo), esc(d.plano.texto));
  h += L('Total estimado do ano', brl(d.total), 'tot');
  out.innerHTML = h;
}

/* ============ SAÍDAS ============ */
function linhasProposta(d, b){            // b = marcador de negrito
  const B = t => b ? b + t + b : t;
  const nm = a => 'Aluno ' + (a.ord+1) + (a.nome ? ' — ' + a.nome : '');
  const L = [];
  L.push(B('Proposta de matrícula ' + d.ano) + ' — ' + d.escola);
  if(d.resp) L.push('Responsável: ' + d.resp);
  d.alunos.forEach(a => {
    L.push('');
    L.push(B(nm(a)) + ' · ' + a.serie);
    L.push('Mensalidade: ' + brl(a.mensCheia) + (a.descPct > 0 ? ' − ' + pctTxt(a.descPct) + (d.parceria ? ' (' + d.parceria.nome + ')' : '') + ' = ' + brl(a.mensLiq) : ''));
    L.push('Anuidade (' + CFG.parcelasAno + 'x): ' + brl(a.anuidade));
    L.push('Didáticos: ' + brl(a.did));
  });
  L.push('');
  L.push(B('Fundo Social Aluno') + (d.fsaOpt ? '' : ' (opcional — fora do total)'));
  d.alunos.forEach(a => L.push(nm(a) + (a.ord > 0 ? ' (−' + pctTxt(CFG.fsaDescIrmaoPct) + ')' : '') + ': ' + brl(a.fsaValor)));
  L.push('Total FSA: ' + brl(d.fsaTotal) + (d.fsaOpt ? ' — ' + (d.fsaParc === 1 ? 'à vista' : d.fsaParc + 'x de ' + brl(d.fsaParcValor)) : ''));
  L.push('');
  L.push(B('Anuidade total: ' + brl(d.anuidadeTotal)));
  L.push('Pagamento (' + d.plano.titulo + '): ' + d.plano.texto);
  L.push('Didáticos total: ' + brl(d.didTotal));
  L.push('FSA total: ' + (d.fsaOpt ? brl(d.fsaTotal) : 'não optou'));
  L.push(B('Total estimado do ano: ' + brl(d.total)));
  if(d.validade) L.push('Proposta válida até ' + d.validade);
  if(d.promotor) L.push('Promotor: ' + d.promotor);
  return L;
}

function copiar(txt, msg){
  const fallback = () => {
    const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t);
    t.select(); try{document.execCommand('copy'); toast(msg);}catch(e){toast('Não foi possível copiar');} t.remove();
  };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(()=>toast(msg), fallback);
  else fallback();
}

function copiarResumo(){
  const d = window._dc; if(!d || !d.completo) return;
  copiar(linhasProposta(d, '*').join('\n'), 'Resumo copiado para WhatsApp');
}

function buildPDFContent(d){
  const R = (a,b,c) => '<tr class="'+(c||'')+'"><td>'+a+'</td><td class="r">'+b+'</td></tr>';
  const nm = a => 'Aluno ' + (a.ord+1) + (a.nome ? ' — ' + esc(a.nome) : '');
  let alu = '';
  d.alunos.forEach(a => {
    alu += '<h2>' + nm(a) + ' · ' + esc(a.serie) + '</h2><table>' +
      R('Mensalidade cheia', brl(a.mensCheia)) +
      (a.descPct > 0 ? R('Desconto' + (d.parceria ? ' — ' + esc(d.parceria.nome) : ' aluno novo') + ' (' + pctTxt(a.descPct) + ')', '− ' + brl(a.descValor)) : '') +
      R('Mensalidade com desconto', brl(a.mensLiq)) +
      R('Anuidade (' + CFG.parcelasAno + ' mensalidades)', brl(a.anuidade)) +
      R('Material escolar (didáticos)', brl(a.did)) + '</table>';
  });
  let fsa = '<h2>Fundo Social Aluno' + (d.fsaOpt ? '' : ' — opcional (fora do total)') + '</h2><table>';
  d.alunos.forEach(a => fsa += R(nm(a) + (a.ord > 0 ? ' (−' + pctTxt(CFG.fsaDescIrmaoPct) + ')' : ''), brl(a.fsaValor)));
  fsa += R('Total FSA', brl(d.fsaTotal), 'bold');
  if(d.fsaOpt) fsa += R('Pagamento do FSA', d.fsaParc === 1 ? 'à vista' : d.fsaParc + 'x de ' + brl(d.fsaParcValor));
  fsa += '</table>';

  return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Proposta '+d.ano+'</title><style>'+
    'body{font-family:Arial,sans-serif;color:#1b2540;margin:32px}h1{margin:0;color:#0b2447;font-size:24px}'+
    '.bar{border-bottom:4px solid #e8b520;padding-bottom:10px;margin-bottom:18px}.sub{color:#6b7691;font-size:13px}'+
    'table{width:100%;border-collapse:collapse;margin:8px 0}td{padding:7px 6px;border-bottom:1px solid #dde3ee;font-size:14px}'+
    '.r{text-align:right;font-weight:bold}.bold td{font-weight:bold}.tot td{background:#fff4cc;font-size:17px;color:#0b2447}'+
    'h2{font-size:15px;color:#0b2447;text-transform:uppercase;margin:18px 0 0}.foot{margin-top:28px;font-size:12px;color:#6b7691}</style></head><body>'+
    '<div class="bar"><h1>Negocie Fácil — Missão Sergipe</h1><div class="sub">Proposta de matrícula '+d.ano+'</div></div>'+
    '<table>'+R('Escola',esc(d.escola))+(d.resp?R('Responsável',esc(d.resp)):'')+'</table>'+
    alu + fsa +
    '<h2>Resumo</h2><table>'+
    R('Anuidade total',brl(d.anuidadeTotal))+
    R('Pagamento: '+esc(d.plano.titulo),esc(d.plano.texto))+
    R('Didáticos total',brl(d.didTotal))+
    R('FSA total',d.fsaOpt?brl(d.fsaTotal):'não optou')+
    R('Total estimado do ano',brl(d.total),'tot')+'</table>'+
    '<div class="foot">'+(d.validade?'Proposta válida até '+d.validade+'. ':'')+(d.promotor?'Promotor: '+esc(d.promotor)+'. ':'')+
    'FSA opcional; descontos não acumulam. Valores sujeitos à confirmação no ato da matrícula.</div></body></html>';
}

function imprimirPDF(){
  const d = window._dc; if(!d || !d.completo) return;
  const w = window.open('', '_blank');
  if(!w){ toast('Libere pop-ups para imprimir'); return; }
  w.document.open(); w.document.write(buildPDFContent(d)); w.document.close();
  w.focus(); setTimeout(() => w.print(), 300);
}

/* ============ CONFIGURAÇÕES ============ */
const CFG_FIELDS = [
  ['ano','Ano letivo','1'],
  ['parcelasAno','Nº de mensalidades da anuidade','1'],
  ['descNovoMax','Desconto máx. aluno novo (%)','0.5'],
  ['fsaMaxParcelas','FSA — máx. de parcelas','1'],
  ['fsaDescIrmaoPct','FSA — desconto a partir do 2º filho (%)','1'],
  ['cartaoParcSemestre','Cartão — parcelas por semestre','1'],
  ['cartaoParcAnual','Cartão — parcelas na anuidade','1']
];

function renderConfig(){
  let h = '<div class="card"><h2>Parâmetros gerais</h2><div class="grid3">';
  CFG_FIELDS.forEach(([k,t,st]) => {
    h += '<div><label>'+t+'</label><input type="number" min="0" step="'+st+'" data-cfg="'+k+'" value="'+CFG[k]+'"></div>';
  });
  h += '</div></div>';

  h += '<div class="card"><h2>Parcerias (desconto fixo)</h2><table class="cfg"><tr><th>Parceria</th><th style="width:130px">Desconto (%)</th></tr>';
  PARCERIAS.forEach((p,i) => {
    h += '<tr><td><input type="text" data-par="'+i+'" data-k="nome" value="'+esc(p.nome)+'"></td>'+
         '<td><input type="number" min="0" max="100" step="0.5" data-par="'+i+'" data-k="pct" value="'+p.pct+'"></td></tr>';
  });
  h += '</table></div>';

  Object.entries(DB.escolas).forEach(([id,e]) => {
    h += '<div class="card"><h2>'+esc(e.nome)+'</h2><div class="row">'+
      '<div><label>Valor do FSA (R$)</label><input type="number" min="0" step="0.01" data-esc="'+id+'" data-k="fsa" value="'+e.fsa+'"></div>'+
      '<div><label>Promotores (um por linha)</label><textarea rows="2" data-esc="'+id+'" data-k="promotores">'+esc(e.promotores.join('\n'))+'</textarea></div></div>'+
      '<table class="cfg"><tr><th>Série</th><th style="width:150px">Mensalidade (R$)</th><th style="width:150px">Didáticos (R$)</th></tr>';
    e.series.forEach((s,i) => {
      h += '<tr><td>'+esc(s.nome)+'</td>'+
        '<td><input type="number" min="0" step="0.01" data-esc="'+id+'" data-s="'+i+'" data-k="mens" value="'+(s.mens==null?'':s.mens)+'"></td>'+
        '<td><input type="number" min="0" step="0.01" data-esc="'+id+'" data-s="'+i+'" data-k="did" value="'+(s.did==null?'':s.did)+'"></td></tr>';
    });
    h += '</table></div>';
  });

  h += '<div class="card"><h2>Backup</h2><div class="cfgbar">'+
    '<button type="button" class="cfgbtn" id="cfgExp">Exportar configuração</button>'+
    '<button type="button" class="cfgbtn alt" id="cfgImp">Importar configuração</button>'+
    '<button type="button" class="cfgbtn alt" id="cfgRst" style="color:var(--bad);border-color:var(--bad)">Restaurar valores da planilha</button>'+
    '<input type="file" id="cfgFile" accept="application/json" style="display:none"></div>'+
    '<div class="hint">As alterações são salvas automaticamente neste navegador. Para levar a mesma configuração a outro computador, exporte e importe o arquivo.</div></div>';
  $('pgConfig').innerHTML = h;
}

function initConfig(){
  const pg = $('pgConfig');
  const onChange = e => {
    const t = e.target;
    const num = () => { const v = parseFloat(t.value); return isNaN(v) ? null : v; };
    if(t.dataset.cfg){
      const v = num();
      if(v == null) return;
      CFG[t.dataset.cfg] = t.dataset.cfg === 'parcelasAno' ? Math.max(2, Math.round(v)) : v;
    } else if(t.dataset.par != null && t.dataset.par !== ''){
      const p = PARCERIAS[+t.dataset.par];
      if(t.dataset.k === 'nome') p.nome = t.value; else { const v = num(); if(v == null) return; p.pct = Math.min(100, Math.max(0, v)); }
    } else if(t.dataset.esc){
      const es = DB.escolas[t.dataset.esc];
      if(t.dataset.s != null && t.dataset.s !== ''){ es.series[+t.dataset.s][t.dataset.k] = num(); }
      else if(t.dataset.k === 'fsa'){ const v = num(); if(v == null) return; es.fsa = v; }
      else es.promotores = t.value.split('\n').map(x => x.trim()).filter(Boolean);
    } else return;
    salvarConfig();
    preencherSelects();
    atualizar();
  };
  pg.addEventListener('change', onChange);
  pg.addEventListener('click', e => {
    if(e.target.id === 'cfgExp'){
      const blob = new Blob([JSON.stringify({cfg:CFG, parcerias:PARCERIAS, escolas:DB.escolas}, null, 2)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'negocie-facil-sergipe-config.json'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } else if(e.target.id === 'cfgImp'){ $('cfgFile').click(); }
    else if(e.target.id === 'cfgRst'){
      if(!confirm('Restaurar todos os valores para os da planilha de levantamento? As alterações feitas serão perdidas.')) return;
      aplicarConfig(clone(DEFAULTS)); salvarConfig(); preencherSelects(); atualizar(); renderConfig(); toast('Valores restaurados');
    }
  });
  pg.addEventListener('change', e => {
    if(e.target.id !== 'cfgFile' || !e.target.files[0]) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const c = JSON.parse(rd.result);
        if(!c.cfg || !c.escolas) throw 0;
        aplicarConfig(c); salvarConfig(); preencherSelects(); atualizar(); renderConfig(); toast('Configuração importada');
      }catch(err){ toast('Arquivo de configuração inválido'); }
    };
    rd.readAsText(e.target.files[0]);
  });
}

init();
initConfig();
</script>
